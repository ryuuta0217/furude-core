plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '+'
    id 'xyz.jpenilla.run-paper' version '+'
    id 'com.gradleup.shadow' version '+'
}

group = 'com.ryuuta0217'
version = '3.5.6'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://oss.sonatype.org/content/groups/public/" }
}

dependencies {
    paperweight.paperDevBundle("26.1.2.build.+")
    implementation group: 'org.mozilla', name: 'rhino', version: '+'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

runServer {
    jvmArgs("-Xmx768M")
}

tasks.build.dependsOn(shadowJar)

jar {
    archiveFileName = "original-" + archiveBaseName.get() + "-" + archiveVersion.get() + "." + archiveExtension.get()
}

shadowJar {
    archiveFileName = archiveBaseName.get() + "-" + archiveVersion.get() + "." + archiveExtension.get()
}

reobfJar {
    outputJar = layout.buildDirectory.file("libs/${project.name}-${project.version}-spigot.jar")
}